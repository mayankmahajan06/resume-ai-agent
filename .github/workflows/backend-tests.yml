name: Backend JD Analyzer Tests

on:
  push:
    branches:
      - main
      - audit/jd-analyzer-skill-matching
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  jd-analyzer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies without browser downloads
        run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: backend
      - name: Run JD analyzer regression tests
        run: npm test
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Angular application
        run: npm run build
